<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avonturiers · Realm of Eeshwar</title>
<style>
  :root {
    --bg: #1d1a15;
    --panel: #2b2620;
    --panel-2: #353026;
    --line: #4a4336;
    --text: #e8dfc8;
    --muted: #a99d82;
    --gold: #e0b44c;
    --green: #6fbf5a;
    --red: #d0604f;
    --blue: #6fa4d6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 18px 24px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 22px; color: var(--gold); letter-spacing: .02em; }
  header .status { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; padding: 20px 24px 40px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
  .top { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .name { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 600; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); }
  .dot.on { background: var(--green); }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--panel-2); color: var(--blue); border: 1px solid var(--line); }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; color: var(--muted); font-size: 13px; }
  .stats span { white-space: nowrap; }
  .stats b { color: var(--text); font-weight: 600; }
  .doing { margin-top: 8px; font-size: 14px; }
  .where { color: var(--muted); font-size: 13px; }
  .where code { color: var(--text); font-size: 12px; }
  .skills { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; padding: 10px 16px; }
  .skill { background: var(--panel-2); border-radius: 4px; padding: 3px 0; text-align: center; font-size: 12px; color: var(--muted); }
  .skill b { display: block; color: var(--text); font-size: 14px; }
  .skill.hi b { color: var(--gold); }
  .tabs { display: flex; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; background: none; border: 0; color: var(--muted); padding: 8px 0; font: inherit; font-size: 13px; cursor: pointer; }
  .tabs button.on { color: var(--gold); box-shadow: inset 0 -2px 0 var(--gold); }
  .log { list-style: none; margin: 0; padding: 8px 16px 14px; max-height: 220px; overflow: auto; font-size: 13px; }
  .log li { display: flex; gap: 10px; padding: 3px 0; border-bottom: 1px dashed #3a342a; }
  .log time { color: var(--muted); flex: 0 0 auto; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); padding: 8px 0; }
  .note { padding: 0 24px 24px; color: var(--muted); font-size: 13px; }
  .ranking { margin: 18px 24px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .ranking h2 { margin: 0; padding: 10px 16px; font-size: 15px; color: var(--gold); border-bottom: 1px solid var(--line); }
  .ranking table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  .ranking th, .ranking td { padding: 7px 16px; text-align: right; border-bottom: 1px solid #3a342a; }
  .ranking th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .ranking th:nth-child(2), .ranking td:nth-child(2) { text-align: left; }
  .ranking th:first-child, .ranking td:first-child { text-align: left; width: 40px; }
  .ranking tr:last-child td { border-bottom: 0; }
  .medal { color: var(--gold); font-weight: 700; }
  .rank { font-size: 13px; color: var(--gold); font-weight: 700; }
</style>
</head>
<body>
<header>
  <h1>Avonturiers</h1>
  <span class="status" id="status">Laden...</span>
</header>
<section class="ranking" id="ranking"></section>
<main id="cards"></main>
<p class="note">Score: totaal level + 2 per questpunt + 1 per miljoen gp aan bezit. Ververst elke 5 seconden. Ga in het spel naar een avonturier met <code>::adventurer &lt;naam&gt;</code>. Quests zonder uitgewerkte playthrough zijn gesimuleerd, en dat staat erbij.</p>
<script>
  const SKILLS = ["attack", "hitpoints", "mining", "strength", "agility", "smithing", "defence", "herblore", "fishing",
    "ranged", "thieving", "cooking", "prayer", "crafting", "firemaking", "magic", "fletching", "woodcutting",
    "runecraft", "runecrafting", "slayer", "farming", "construction", "hunter", "sailing"];
  const TABS = [["skill", "Skills"], ["quest", "Quests"], ["boss", "Bosses"], ["drop", "Drops"], ["bank", "Bank"], ["activity", "Activiteit"]];
  const chosenTab = {};

  function esc(text) {
    return String(text ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }
  function time(at) {
    const d = new Date(at);
    return d.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
  }
  function minutesLeft(until) {
    const left = Math.max(0, Math.round((until - Date.now()) / 60000));
    return left > 0 ? ` · nog ${left} min` : "";
  }
  function skillGrid(skills) {
    const names = SKILLS.filter((name) => skills[name]);
    for (const name of Object.keys(skills)) if (!names.includes(name)) names.push(name);
    return names.map((name) => {
      const level = skills[name].level;
      return `<div class="skill ${level >= 90 ? "hi" : ""}" title="${esc(name)}: ${skills[name].xp.toLocaleString("nl-NL")} xp"><b>${level}</b>${esc(name.slice(0, 4))}</div>`;
    }).join("");
  }
  function gp(value) {
    const v = Number(value) || 0;
    if (v >= 1_000_000) return `${(v / 1_000_000).toLocaleString("nl-NL", { maximumFractionDigits: 1 })}m`;
    if (v >= 100_000) return `${Math.round(v / 1_000).toLocaleString("nl-NL")}k`;
    return v.toLocaleString("nl-NL");
  }
  function bankList(adventurer) {
    const stacks = adventurer.bank ?? [];
    const w = adventurer.wealth;
    const head = w ? `<li><span>Bank <b>${gp(w.bank)}</b> · bij zich <b>${gp(w.carried)}</b> · totaal <b>${gp(w.total)}</b> gp</span></li>` : "";
    if (stacks.length === 0) return head + `<li class="empty">De bank is nog leeg.</li>`;
    return head + stacks.map((stack) => `<li><time>${gp(stack.value)}</time><span>${stack.amount > 1 ? `${stack.amount.toLocaleString("nl-NL")} x ` : ""}${esc(stack.name)}</span></li>`).join("");
  }
  function ranking(list) {
    const rows = list.map((a) => `<tr><td class="${a.rank <= 3 ? "medal" : ""}">#${a.rank}</td><td>${esc(a.name)}</td><td>${a.score}</td>
      <td>${a.total ?? "-"}</td><td>${a.combat ?? "-"}</td><td>${a.questPoints}</td><td>${gp(a.wealth?.total)}</td></tr>`).join("");
    return `<h2>Ranglijst</h2><table><tr><th></th><th>Naam</th><th>Score</th><th>Totaal</th><th>Combat</th><th>QP</th><th>Bezit</th></tr>${rows}</table>`;
  }
  function logList(adventurer, tab) {
    if (tab === "bank") return bankList(adventurer);
    const lines = (adventurer.journal ?? []).filter((entry) => (entry.type ?? "activity") === tab);
    if (tab === "quest" && adventurer.quests.length > 0 && lines.length === 0) {
      return `<li class="empty">${adventurer.quests.length} quests voltooid.</li>`;
    }
    if (lines.length === 0) return `<li class="empty">Nog niets.</li>`;
    return lines.map((entry) => `<li><time>${time(entry.at)}</time><span>${esc(entry.text)}</span></li>`).join("");
  }
  function card(adventurer) {
    const tab = chosenTab[adventurer.name] ?? "skill";
    const where = adventurer.location
      ? `Bij <b>${esc(adventurer.location.near)}</b> <code>(${adventurer.location.x}, ${adventurer.location.y}, ${adventurer.location.z})</code>`
      : "Offline";
    return `<section class="card">
      <div class="top">
        <div class="name"><span class="rank">#${adventurer.rank}</span><span class="dot ${adventurer.online ? "on" : ""}"></span>${esc(adventurer.name)}
          ${adventurer.group ? '<span class="tag">samen</span>' : ""}</div>
        <div class="stats">
          <span>Combat <b>${adventurer.combat ?? "-"}</b></span>
          <span>Totaal <b>${adventurer.total ?? "-"}</b></span>
          <span>QP <b>${adventurer.questPoints}</b></span>
          <span>Quests <b>${adventurer.quests.length}/${adventurer.questsOnPath}</b></span>
          <span>Bezit <b>${gp(adventurer.wealth?.total)}</b></span>
        </div>
        <div class="doing">${esc(adventurer.doing)}${minutesLeft(adventurer.until)}</div>
        <div class="where">${where}</div>
      </div>
      <div class="skills">${skillGrid(adventurer.skills ?? {})}</div>
      <div class="tabs">${TABS.map(([key, label]) => `<button data-name="${esc(adventurer.name)}" data-tab="${key}" class="${key === tab ? "on" : ""}">${label}</button>`).join("")}</div>
      <ul class="log">${logList(adventurer, tab)}</ul>
    </section>`;
  }

  let last = null;
  function render() {
    if (!last) return;
    document.getElementById("ranking").innerHTML = ranking(last.adventurers);
    document.getElementById("cards").innerHTML = last.adventurers.map(card).join("");
  }
  document.addEventListener("click", (event) => {
    const button = event.target.closest(".tabs button");
    if (!button) return;
    chosenTab[button.dataset.name] = button.dataset.tab;
    render();
  });

  async function refresh() {
    const status = document.getElementById("status");
    try {
      const reply = await fetch("/api/adventurers", { cache: "no-store" });
      if (!reply.ok) throw new Error(String(reply.status));
      last = await reply.json();
      status.textContent = last.adventurers.length > 0
        ? `Bijgewerkt om ${time(last.updated)}`
        : "Nog geen avonturiers: ze komen een paar seconden na het starten van de server.";
      render();
    } catch (error) {
      status.textContent = "De gameserver is niet bereikbaar. Draait het spel?";
    }
  }
  refresh();
  setInterval(refresh, 5000);
</script>
</body>
</html>
